<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Chan Candy Rock Star</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101317;
      color: #edf2f7;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 24px;
      border: 1px solid #34404d;
      border-radius: 8px;
      background: #181e24;
    }
    a { color: #5cc8ff; }
  </style>
</head>
<body>
  <main>
    <h1>Unity Chan Candy Rock Star</h1>
    <p id="status">Opening latest version...</p>
    <p><a id="fallback" href="./versions/20260615T230836Z-03dee989/">Open latest version</a></p>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const fallbackEl = document.getElementById('fallback');
    const params = new URLSearchParams(location.search);
    const cacheKey = params.get('v') || Date.now();
    fetch('./current.json?v=' + encodeURIComponent(cacheKey), { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then((current) => {
        const versionId = current && current.versionId;
        if (!versionId) throw new Error('current.json does not include versionId');
        const target = './versions/' + encodeURIComponent(versionId) + '/' + location.search + location.hash;
        fallbackEl.href = target;
        location.replace(target);
      })
      .catch((error) => {
        statusEl.textContent = 'Failed to open latest version: ' + error.message;
      });
  </script>
</body>
</html>
